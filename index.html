<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Dia</title>
<meta name="description" content="Contador de calorias e nutrientes com leitor de código de barras, receitas, água e tracker de peso.">
<meta name="theme-color" content="#F3EEE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Dia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="preload" href="vendor/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ícones (traço 2px, 24×24) -->

    <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7.5c-1.4-1.1-3.4-1.4-4.9-.7C4.6 8 4.2 11 5.1 14c.9 3 2.9 6.5 4.9 6.5 1 0 1.3-.5 2-.5s1 .5 2 .5c2 0 4-3.5 4.9-6.5.9-3 .5-6-2-7.2-1.5-.7-3.5-.4-4.9.7z"/><path d="M12 7.5c0-2 1-3.6 3-4.2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-cookie" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 3 3 0 0 1-3.5-3A3 3 0 0 1 14 5.5 3 3 0 0 1 12 3z"/><path d="M8.5 10.5h.01M15 15h.01M10 16h.01M12 12.5h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7.5h6"/></symbol>

    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5M3 16.5l9 5 9-5"/></symbol>
    <symbol id="i-pot" viewBox="0 0 24 24"><path d="M2 10h20M4.5 10v7a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-7M9 6.5c0-1 1-1.5 1-2.5M14 6.5c0-1 1-1.5 1-2.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M7 2.5h10v4l-2.5 4v10a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-10L7 6.5zM7 6.5h10M12 13.5v2"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9" stroke-width="2.2"/></symbol>

    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="3"/><path d="M8 7h8M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18.5h7" stroke-width="2.2"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
    <symbol id="i-run" viewBox="0 0 24 24"><circle cx="14.5" cy="4.5" r="1.8"/><path d="m6 20 3.5-5 3 2.5V21M8 10.5l3-3 3.5 2.5 2.5 3H20M11 7.5l-1.5 6"/></symbol>
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 1 0 18M3.6 9.5h16.8M3.6 14.5h16.8"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h6M14.5 3.5V7h4"/></symbol>
  </defs>
</svg>

<div class="wrap">

  <!-- ===== DIÁRIO ===== -->
  <section id="view-diary">
    <header class="top">
      <button class="titlebtn" id="dateBtn" aria-label="Escolher data"><small id="dateSub"></small><h1 id="dateLabel">Hoje</h1></button>
      <input type="date" id="datePick" class="vh" tabindex="-1" aria-hidden="true">
      <div class="top-actions">
        <button class="pill hidden" id="todayBtn">Hoje</button>
        <button class="streak" id="streakBtn" aria-label="Sequência de dias registrando"></button>
        <button class="round" id="quickBtn" aria-label="Adição rápida (só calorias)"><svg class="ic"><use href="#i-bolt"/></svg></button>
      </div>
    </header>

    <div class="week" id="week"></div>

    <button class="searchbar" id="searchBtn"><svg class="ic"><use href="#i-search"/></svg><span>Buscar alimento, marca, receita…</span></button>

    <div class="hero" id="hero">
      <div class="hero-top">
        <div class="ring">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <circle class="trk" cx="70" cy="70" r="60"/>
            <circle class="seg plan" id="segPl" cx="70" cy="70" r="60"/>
            <circle class="seg" id="segK" cx="70" cy="70" r="60" style="stroke:var(--lime)"/>
            <circle class="seg" id="segP" cx="70" cy="70" r="60" style="stroke:var(--prot)"/>
            <circle class="seg" id="segC" cx="70" cy="70" r="60" style="stroke:var(--carb)"/>
            <circle class="seg" id="segG" cx="70" cy="70" r="60" style="stroke:var(--gord)"/>
          </svg>
          <div class="c"><b id="kcalBig">0</b><span id="kcalLbl">kcal restantes</span></div>
        </div>
        <div class="hero-side">
          <div><span>Meta</span><b id="hGoal">—</b></div>
          <div><span>Comido</span><b id="hEaten">—</b></div>
          <div><span>Do dia</span><b id="hPct">—</b></div>
        </div>
      </div>
      <div class="hplan hidden" id="hPlan"></div>
      <div class="macros" id="macros"></div>
      <button class="more" id="moreNuts"></button>
      <div class="bars hidden" id="bars"></div>
    </div>

    <div class="card water" id="water"></div>
    <div class="card habits" id="habits"></div>

    <div id="shortcutsWrap" class="hidden">
      <div class="sec-title">Atalhos</div>
      <div class="chips" id="shortcuts"></div>
    </div>

    <div id="dayEmpty"></div>
    <div id="meals"></div>
    <div id="nag"></div>
  </section>

  <!-- ===== PROGRESSO ===== -->
  <section id="view-progress" class="hidden">
    <header class="top"><div class="titlebtn"><small>como você está indo</small><h1>Progresso</h1></div></header>
    <div class="card hcal" id="pcal"></div>
    <div class="seg big" id="pRange"><button data-r="7">7 dias</button><button data-r="30" class="on">30 dias</button><button data-r="90">90 dias</button></div>
    <div class="tiles" id="ptiles"></div>
    <div class="card"><div class="ch">Calorias por dia</div><div id="pchart" class="chart"></div></div>
    <div class="card dark-card" id="ptdee"></div>
    <div class="card"><div class="ch">De onde vêm as calorias</div><div id="pmacros"></div></div>
    <div class="card"><div class="ch">Mais calorias no período</div><div id="ptop"></div></div>
    <div class="card" id="pwaterWrap"><div class="ch">Água</div><div id="pwater"></div></div>
  </section>

  <!-- ===== PESO ===== -->
  <section id="view-weight" class="hidden">
    <header class="top"><div class="titlebtn"><small>sua tendência</small><h1>Peso</h1></div></header>
    <div class="hero weight-hero">
      <div class="wstats" id="wstats"></div>
      <div id="wprog"></div>
    </div>
    <div id="wforecast"></div>
    <div class="card">
      <div class="seg" id="wRange">
        <button data-r="30" class="on">30 dias</button><button data-r="90">90 dias</button><button data-r="365">1 ano</button><button data-r="0">Tudo</button>
      </div>
      <div id="wchart" class="chart"></div>
    </div>
    <button class="btn full" id="addWeightBtn"><svg class="ic"><use href="#i-plus"/></svg> Registrar peso</button>
    <div class="sec-title">Registros</div>
    <div class="card" id="wlist"></div>
  </section>
</div>

<!-- barra inferior -->
<nav class="dock" aria-label="Navegação">
  <div class="tabs">
    <button data-tab="diary" class="on"><svg class="ic"><use href="#i-book"/></svg><span>Diário</span></button>
    <button data-tab="progress"><svg class="ic"><use href="#i-chart"/></svg><span>Progresso</span></button>
    <button class="fab" id="scanBtn" aria-label="Escanear código de barras"><svg class="ic"><use href="#i-scan"/></svg></button>
    <button data-tab="weight"><svg class="ic"><use href="#i-scale"/></svg><span>Peso</span></button>
    <button id="settingsTab"><svg class="ic"><use href="#i-sliders"/></svg><span>Ajustes</span></button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="photoInput" accept="image/*" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">

<!-- folha (modal inferior) -->
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<!-- scanner em tela cheia -->
<div class="scanner hidden" id="scanner">
  <video id="video" playsinline muted></video>
  <div class="frame"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><div class="laser"></div></div>
  <div class="scan-top">
    <button class="round dark" id="scanClose" aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
    <button class="round dark hidden" id="torchBtn" aria-label="Lanterna"><svg class="ic"><use href="#i-torch"/></svg></button>
  </div>
  <div class="scan-msg" id="scanMsg">Aponte para o código de barras</div>
  <div class="scan-bottom">
    <button class="btn glass" id="scanType"><svg class="ic"><use href="#i-keyboard"/></svg> Digitar código</button>
    <button class="btn glass" id="scanPhoto"><svg class="ic"><use href="#i-image"/></svg> Usar foto</button>
  </div>
</div>

<script src="vendor/zxing.min.js" defer></script>
<script src="foods.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/food.js" defer></script>
<script src="js/diary.js" defer></script>
<script src="js/scanner.js" defer></script>
<script src="js/weight.js" defer></script>
<script src="js/progress.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/sync.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
